name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      pw-version: ${{ steps.pw-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Get Playwright version
      id: pw-version
      run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace('^','')")" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.setup.outputs.pw-version }}-noble
      options: --user root
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install chromium firefox webkit

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
