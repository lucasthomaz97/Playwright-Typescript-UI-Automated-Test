name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install chromium firefox webkit

    - name: Cache Playwright system dependencies
      uses: actions/cache@v4
      id: playwright-deps-cache
      with:
        path: /var/cache/apt/archives
        key: playwright-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright system dependencies
      if: steps.playwright-deps-cache.outputs.cache-hit != 'true'
      run: npx playwright install-deps chromium firefox webkit

    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
